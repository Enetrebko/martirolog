name: Deploy to Droplet

on:
  push:
    branches: [master]

# Prevent overlapping deploys if you push twice quickly
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: martirolog
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/martirolog
            git pull origin master
            ./venv/bin/pip install -r requirements.txt
            # Sync the unit file from the repo, reload only if it changed
            if ! cmp -s deploy/martirolog.service /etc/systemd/system/martirolog.service; then
              cp deploy/martirolog.service /etc/systemd/system/martirolog.service
              systemctl daemon-reload
            fi
            systemctl restart martirolog
            # Give it a moment, then verify it actually came back up
            sleep 3
            systemctl is-active --quiet martirolog && echo "Service is running" || (echo "Service failed to start"; journalctl -u martirolog -n 30 --no-pager; exit 1)