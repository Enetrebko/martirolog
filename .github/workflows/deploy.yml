name: Deploy to Droplet

on:
  push:
    branches: [master]

# Prevent overlapping deploys if you push twice quickly
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: martirolog
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/martirolog
            git pull origin master
            ./venv/bin/pip install -r requirements.txt
            # Sync the unit file from the repo, reload if it changed
            if ! cmp -s martirolog.service /etc/systemd/system/martirolog.service; then
              cp martirolog.service /etc/systemd/system/martirolog.service
              systemctl daemon-reload
            fi
            systemctl restart martirolog
            sleep 3
            systemctl is-active --quiet martirolog || (journalctl -u martirolog -n 30 --no-pager; exit 1)