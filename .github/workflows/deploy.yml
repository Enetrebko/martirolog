name: Deploy to Droplet

on:
  push:
    branches: [master]

# Prevent overlapping deploys if you push twice quickly
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/martirolog
            git pull origin main
            ./venv/bin/pip install -r requirements.txt
            systemctl restart martirolog
            # Give it a moment, then verify it actually came back up
            sleep 3
            systemctl is-active --quiet martirolog && echo "Service is running" || (echo "Service failed to start"; journalctl -u martirolog -n 30 --no-pager; exit 1)